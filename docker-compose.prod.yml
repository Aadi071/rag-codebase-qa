# Full stack in containers (app + pgvector) - the "runs anywhere" proof.
#   docker compose -f docker-compose.prod.yml up --build
#   open http://localhost:8000
# Set OPENAI_API_KEY in your shell or a .env file first.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      EMBEDDING_BACKEND: openai        # hosted: no torch in the image
      LLM_BACKEND: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOW_INDEXING: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_prod:
