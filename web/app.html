<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSage</title>
<style>
  :root{color-scheme:light}*{box-sizing:border-box}
  body{margin:0;background:#f7f6f3;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  a{color:#d9622b;text-decoration:none}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid #e6e3dc}
  .logo{font-weight:800;font-size:17px}.logo span{color:#d9622b}
  .nav-links{display:flex;align-items:center;gap:16px;font-size:13.5px}
  .nav-links .who{color:#888}
  .wrap{max-width:820px;margin:24px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #e6e3dc;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  label{font-size:12px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.03em}
  .row{display:flex;gap:8px;margin-top:8px}
  input[type=text]{flex:1;padding:9px 11px;border:1px solid #ddd8cd;border-radius:8px;font-size:14px}
  button{padding:9px 16px;border:none;border-radius:8px;background:#d9622b;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{background:#e6c4b0;cursor:not-allowed}
  .status{margin-top:10px;font-size:13px;color:#7a5a2d;min-height:18px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .answer{white-space:pre-wrap;line-height:1.55;font-size:14.5px}
  .sources{margin-top:14px;border-top:1px solid #eee;padding-top:10px}
  .src{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#444;padding:2px 0}
  .muted{color:#9a9a9a;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .fb{margin-top:16px;border-top:1px solid #eee;padding-top:12px}
  .stars{font-size:26px;cursor:pointer;user-select:none;letter-spacing:2px}
  .stars span{color:#ddd}.stars span.on{color:#e0a030}
  .fb textarea{width:100%;margin-top:8px;border:1px solid #ddd8cd;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;min-height:40px}
  .fb .sub{margin-top:8px;padding:7px 14px;font-size:13px}
</style></head><body>
  <div class="nav">
    <a class="logo" href="/">Code<span>Sage</span></a>
    <div class="nav-links">
      <a href="/analytics">Analytics</a>
      <span class="who" id="who"></span>
      <a href="#" onclick="signout();return false">Sign out</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <label>GitHub repository</label>
      <div class="row">
        <input id="repo" type="text" value="https://github.com/pallets/click" placeholder="https://github.com/owner/repo">
        <button id="indexBtn" onclick="startIndex()">Index</button>
      </div>
      <div class="status" id="indexStatus"></div>
    </div>

    <div class="card">
      <label>Ask a question</label>
      <div class="row">
        <input id="q" type="text" placeholder="how are aliases resolved for a command?" onkeydown="if(event.key==='Enter') ask()">
        <button id="askBtn" onclick="ask()">Ask</button>
      </div>
      <div class="status" id="askStatus"></div>
      <div class="answer" id="answer"></div>
      <div class="sources" id="sources"></div>
      <div class="fb" id="fb" style="display:none">
        <div class="muted">How satisfied are you with this answer?</div>
        <div class="stars" id="stars"></div>
        <textarea id="comment" placeholder="Optional: what was good or missing? (helps improve answers)"></textarea>
        <button class="sub" onclick="sendFeedback()">Submit feedback</button>
        <span id="fbMsg" style="font-size:13px;margin-left:10px"></span>
      </div>
    </div>
  </div>
<script>
const token=localStorage.getItem('cs_token');
if(!token){ location.href='/login'; }
const AUTH={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
document.getElementById('who').textContent=localStorage.getItem('cs_email')||'';
function signout(){ localStorage.removeItem('cs_token'); localStorage.removeItem('cs_email'); location.href='/login'; }
function dot(c){return '<span class="dot" style="background:'+c+'"></span>';}

let pollTimer=null, currentInteraction=null, rating=0;

function startIndex(){
  const repo=document.getElementById('repo').value.trim(); if(!repo) return;
  document.getElementById('indexStatus').innerHTML=dot('#e0a030')+'Starting...';
  fetch('/api/index',{method:'POST',headers:AUTH,body:JSON.stringify({repo_url:repo})}).then(()=>poll(repo));
}
function poll(repo){
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    const s=await (await fetch('/api/status?repo='+encodeURIComponent(repo),{headers:AUTH})).json();
    const L={cloning:'Cloning repo...',indexing:'Indexing (only changed files)...',chunking:'Chunking code...',embedding:'Embedding chunks...',storing:'Storing vectors...'};
    const el=document.getElementById('indexStatus');
    if(s.stage==='ready'){clearInterval(pollTimer);el.innerHTML=dot('#1f7a3d')+'Ready - '+(s.chunks||'')+' chunks indexed.';}
    else if(s.stage==='error'){clearInterval(pollTimer);el.innerHTML=dot('#b3311c')+'Error: '+(s.error||'unknown');}
    else if(s.stage==='unindexed'){clearInterval(pollTimer);el.innerHTML=dot('#9a9a9a')+'Not indexed yet - click Index.';}
    else{el.innerHTML=dot('#e0a030')+(L[s.stage]||s.stage)+(s.chunks?' ('+s.chunks+' chunks)':'');}
  },1500);
}
function renderStars(){
  const box=document.getElementById('stars');
  box.innerHTML=[1,2,3,4,5].map(i=>'<span data-i="'+i+'" class="'+(i<=rating?'on':'')+'">&#9733;</span>').join('');
  box.querySelectorAll('span').forEach(s=>s.onclick=()=>{rating=+s.dataset.i;renderStars();});
}
function ghLink(repo,path,s,e){
  const base=String(repo).replace(/\.git$/,'').replace(/\/+$/,'');
  const p=String(path).replace(/\\/g,'/');
  return base+'/blob/HEAD/'+p+'#L'+s+(e&&e!=s?('-L'+e):'');
}
function renderSources(sources, repo){
  const box=document.getElementById('sources');
  if(!sources||!sources.length){box.innerHTML='';return;}
  let h='<div class="muted">Sources (click to open on GitHub)</div>';
  sources.forEach(s=>{
    h+='<div class="src"><a href="'+ghLink(repo,s.path,s.start,s.end)+'" target="_blank" rel="noopener">'
      +s.path+':'+s.start+'-'+s.end+'</a>'+(s.symbol?'  ('+s.symbol+')':'')+'</div>';
  });
  box.innerHTML=h;
}
async function ask(){
  const repo=document.getElementById('repo').value.trim();
  const q=document.getElementById('q').value.trim(); if(!q) return;
  const ans=document.getElementById('answer');
  ans.textContent=''; document.getElementById('sources').innerHTML='';
  document.getElementById('fb').style.display='none'; document.getElementById('fbMsg').textContent=''; rating=0;
  document.getElementById('askStatus').innerHTML=dot('#e0a030')+'Thinking (streaming)...';
  document.getElementById('askBtn').disabled=true;
  let answerText='';
  try{
    const res=await fetch('/api/ask_stream',{method:'POST',headers:AUTH,body:JSON.stringify({repo_url:repo,question:q})});
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,i); buf=buf.slice(i+2);
        let ev='message', dataStr='';
        raw.split('\n').forEach(line=>{
          if(line.indexOf('event:')===0) ev=line.slice(6).trim();
          else if(line.indexOf('data:')===0) dataStr+=line.slice(5).trim();
        });
        let data; try{data=JSON.parse(dataStr);}catch(e){data=dataStr;}
        if(ev==='meta'){
          renderSources(data.sources, repo);
          document.getElementById('askStatus').innerHTML = data.cached?(dot('#1f6fa8')+'Served instantly from cache'):'';
        } else if(ev==='token'){
          answerText+=data; ans.textContent=answerText;
        } else if(ev==='done'){
          currentInteraction=data.interaction_id;
          renderStars(); document.getElementById('comment').value='';
          document.getElementById('fb').style.display='block';
          if(!data.cached) document.getElementById('askStatus').innerHTML='';
        }
      }
    }
  }catch(e){ document.getElementById('askStatus').innerHTML=dot('#b3311c')+'Request failed'; }
  finally{ document.getElementById('askBtn').disabled=false; }
}
async function sendFeedback(){
  if(!currentInteraction||!rating){ document.getElementById('fbMsg').textContent='Pick a star rating first.'; return; }
  const r=await fetch('/api/feedback',{method:'POST',headers:AUTH,body:JSON.stringify({
    interaction_id:currentInteraction,rating:rating,comment:document.getElementById('comment').value})});
  document.getElementById('fbMsg').textContent = r.ok ? 'Thanks! Saved.' : 'Failed to save.';
}
// on load: reflect index state of default repo
window.addEventListener('load',()=>{const repo=document.getElementById('repo').value.trim(); if(repo) poll(repo);});
</script></body></html>
